version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: chore, include: scope }
    groups:
      npm: { patterns: ['*'] }
    ignore:
      # Types follow the Node LTS line we run on (see the docker entry below).
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
  - package-ecosystem: gomod
    directory: /cli
    schedule: { interval: weekly }
    commit-message: { prefix: chore, include: scope }
    groups:
      go: { patterns: ['*'] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: chore, include: scope }
    groups:
      actions: { patterns: ['*'] }
  - package-ecosystem: docker
    directory: /deploy
    schedule: { interval: weekly }
    commit-message: { prefix: chore, include: scope }
    ignore:
      # Stay on the Node LTS line (24); odd majors are short-lived. Move to the next LTS by hand,
      # together with setup-node in the workflows and @types/node.
      - dependency-name: node
        update-types: [version-update:semver-major]
