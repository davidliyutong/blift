name: release

on:
  push:
    tags: ['v*']

# Build jobs only read the repository; `image` writes the container registry and `publish`
# creates the GitHub release. Nothing is published unless every build succeeds.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: Tag matches the server version and the changelog
        run: |
          want="${GITHUB_REF_NAME#v}"
          got=$(sed -n 's/.*VERSION = "\(.*\)".*/\1/p' server/src/version.ts)
          [ "$got" = "$want" ] || { echo "::error::tag $GITHUB_REF_NAME, but server/src/version.ts says $got"; exit 1; }
          grep -q "^## \[$want\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no [$want] section"; exit 1; }
      - run: pnpm install --frozen-lockfile
      - run: make test

  cli:
    runs-on: ubuntu-24.04
    needs: verify
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - run: make cli-dist VERSION=${{ github.ref_name }}
      - uses: actions/upload-artifact@v7
        with:
          name: cli
          path: dist/release/*.tar.gz
          if-no-files-found: error

  # Multi-arch image on GHCR: <version>, <major>.<minor> and latest.
  image:
    runs-on: ubuntu-24.04
    needs: verify
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # GitHub stores attestations for public repositories only (private ones need Enterprise Cloud).
      - uses: actions/attest-build-provenance@v4
        if: ${{ !github.event.repository.private }}
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  publish:
    runs-on: ubuntu-24.04
    needs: [cli, image]
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: cli
          path: dist/release
      - name: Checksums
        run: cd dist/release && sha256sum *.tar.gz > SHA256SUMS && cat SHA256SUMS
      - uses: actions/attest-build-provenance@v4
        if: ${{ !github.event.repository.private }}
        with:
          subject-checksums: dist/release/SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          ver=${GITHUB_REF_NAME#v}
          awk -v v="$ver" '$0 ~ "^## \\[" v "\\]" {p=1; next} /^## \[/ {p=0} p' CHANGELOG.md > notes.md
          printf '\n### Docker image\n\n```sh\ndocker pull %s:%s\n```\n' "$IMAGE" "$ver" >> notes.md
          gh release create "$GITHUB_REF_NAME" dist/release/*.tar.gz dist/release/SHA256SUMS \
            --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
