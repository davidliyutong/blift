name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck, unit tests, build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - run: pnpm install --frozen-lockfile
      - run: make test
      - run: make build cli-all
      - name: The committed wrangler.toml stays a template
        run: grep -q 'database_id = "00000000-0000-0000-0000-000000000000"' server/wrangler.toml

  # Real object storage (RustFS container), a fresh server, the API suite (incl. a mock OIDC
  # provider) and the CLI suite. See scripts/smoke.sh.
  smoke:
    name: end-to-end (RustFS + API + CLI)
    runs-on: ubuntu-24.04
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - run: pnpm install --frozen-lockfile
      - run: make build-server cli
      - run: make smoke

  docker:
    name: docker image builds
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
